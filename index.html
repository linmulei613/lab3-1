<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1>My Website</h1>
    </header>

    <nav class="nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <main class="main">
      <div class="card-grid">
        <article class="card card-featured">
          <h3>Card1</h3>
          <p>this is card 1</p>
        </article>

        <article class="card">
          <h3>Card2</h3>
          <p>this is card 2.</p>
        </article>

        <article class="card">
          <h3>card3</h3>
          <p>this is card 3.</p>
        </article>
      </div>
    </main>

    <footer class="footer">
      <p>This is a footer.</p>
    </footer>
  </div>
</body>
</html>
